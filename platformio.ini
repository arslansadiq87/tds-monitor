[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; Optional OTA upload (uncomment if you use it)
;upload_protocol = espota
;upload_port = tds.local
;upload_flags =
;  --timeout=30
  
; ElegantOTA: force AsyncWebServer mode
build_flags =
  -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

lib_deps =
  bblanchon/ArduinoJson @ ^7.0.4
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^4.0.4
  ayushsharma82/ElegantOTA @ ^3.1.7
  ESP32Async/AsyncTCP @ ^3.3.2
  ESP32Async/ESPAsyncWebServer @ ^3.6.0

; IMPORTANT:
; If you previously used WiFiManager or old Async libs, delete:
;   .pio/libdeps/esp32dev
; and rebuild so PlatformIO fetches the correct versions.
